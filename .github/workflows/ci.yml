name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: nix flake check
        run: nix flake check --no-build

      - name: cargo fmt
        run: nix develop --command cargo fmt --all --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      # scripts/test.sh is the command the project tells people to run, so it
      # is the command CI runs: `cargo test` alone hides a skipped assertion's
      # line, and a host without cgroup v2 delegation cannot make some of
      # them. The script prints them from the skip log; the next step turns
      # each one into a warning on this run. A green check is not the same
      # claim on every host, and that difference must be visible.
      - name: test suite
        run: |
          set -o pipefail
          nix develop --command ./scripts/test.sh 2>&1 | tee test-output.txt

      - name: report the assertions this host could not make
        if: always()
        run: ./scripts/report-skips.sh test-output.txt

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-docs.sh
      - run: ./scripts/check-orchestration.sh
