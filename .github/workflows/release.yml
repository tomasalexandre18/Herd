# What a release is: three statically linked binaries, the hub's container
# image as an archive, and a SHA256SUMS covering all four, built on a pushed
# tag, plus this version's own notes — `deploy/release-notes/<version>.md`,
# written by a person — and `deploy/release-notice.md`, the standing notice,
# both quoted into the release body (ORCH-162, D132). The
# first consumer's team deploys on their own machines, so a release has to be
# something a person can download onto an Arch box or a WSL2 PC and run —
# which the flake's default packages are not: they are linked against glibc
# out of the Nix store and do not exec on a host without Nix.
#
# Since D162 the hub's image ships **as a release asset**, `docker load`ed by
# the operator, and not pushed to a registry. D153 put it on Docker Hub and
# guarded the tag with a credential preflight; that preflight then failed
# every tag from v0.3.1 to v0.3.3 — in 22, 24 and 26 seconds, before a single
# binary was built — because the credentials it demanded were never created.
# Three tags produced no release at all. What survives of D153 is its intent,
# which this file still keeps: an operator gets a runnable hub image out of a
# tag without building it, from the one derivation that has ever built it.
# What does not survive is a registry as the only way to get one, and an
# optional publication holding a veto over the binaries.
#
# **The order below is the guarantee.** The binaries are the floor: they are
# built, proved, summed and *published* before the image is so much as built,
# so nothing about the image can cost a tag its release again. The body is
# written in two halves for the same reason — the half that promises the
# archive is added only once the archive is attached, so a release never
# describes an asset that is not there.
#
# **Rehearsing it without a tag.** `workflow_dispatch` with the `tag` input
# left empty runs every step above the release: the build, the two version
# numbers read out of the source, both distribution smokes, the static
# assertions, the sums, the image build, the archive assertion and
# `image-smoke.sh` against the loaded archive. What it does *not* run is the
# body itself, which is written only for a tag. It creates no
# tag and no release, and leaves the binaries and the archive on the run as
# artifacts. Given a `tag` that already exists, it publishes the release for
# it — which is how a tag whose run failed is recovered without cutting a new
# version.
#
# **The dev lane calls this file; it does not copy it.** `release-dev.yml`
# publishes `v*.*.*-dev*` tags off any branch, and it does so through
# `workflow_call` below with `dev: true`, so a dev build is this build —
# same derivations, same static assertions, same two distribution smokes,
# same image smoke, same two version lines. All `dev` changes is the body,
# which gains a preamble saying what the build is, and the pre-release flag,
# which stops being a consequence of the hyphen and becomes a decision. Two
# copies of the steps below would drift, and the first anyone would learn of
# it is a hotfix that behaves unlike the release that follows it (D172).
#
# This file is **not** the merge gate. `ci.yml` is, with its `check` and
# `docs` jobs, and nothing here touches it.
name: release

on:
  push:
    tags:
      - "v*"
      # …but never a `-dev` tag. `release-dev.yml` owns those and calls this
      # workflow back for them; without this exclusion one dev tag would
      # start two runs racing to create one release, and the loser's error
      # would be the first thing read in an emergency.
      - "!v*.*.*-dev*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to publish the release on, e.g. v0.1.0. It must already exist.
          Left empty, the binaries and the hub image are built and verified
          and attached to this run, and no release is created.
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: >-
          Tag to publish on. It must already exist. Empty rehearses the
          build and creates nothing, exactly as the hand-run does.
        required: false
        type: string
        default: ""
      dev:
        description: >-
          Publish as a development build: a pre-release whatever its tag
          looks like, with a preamble on the body saying it skipped the
          merge gate and naming the branch and commit it came from.
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled: a half-uploaded release is worse than a slow one.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # One job and not two, deliberately. The binaries, the image and the
  # release are one release, and steps in one job run in an order a reader
  # can see; splitting the image into a job of its own would make the floor
  # structural but would also have to pass the binaries between jobs to run
  # `image-smoke.sh`, and would let GitHub decide what runs when. The step
  # order below buys the same guarantee and can be read top to bottom.
  binaries:
    name: static binaries and the hub image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One place where "which tag, if any" is decided. A tag push releases
      # under its own name — and that holds when `release-dev.yml` called
      # this workflow, because a called workflow sees the caller's ref, so a
      # dev tag arrives here the same way any other tag does. A hand-run, and
      # a call started by hand, release only if given one.
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      # "true" only when `release-dev.yml` called this workflow. A tag push
      # and a hand-run leave `inputs` empty, which renders false, so every
      # `$DEV` test below is inert on the path that cuts real releases.
      DEV: ${{ inputs.dev || false }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The version comes from `Cargo.toml`'s `workspace.package.version`,
      # read through the flake — `flake.nix` reads it once and every package
      # takes it from there, so this is the same figure as the hub image's
      # tag and cannot be a number somebody typed here. The triple comes from
      # the derivation's own host platform for the same reason.
      - name: the version and the target, from the workspace
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#static.version)
          triple=$(nix eval --raw .#static.stdenv.hostPlatform.config)
          echo "version=$version" >> "$GITHUB_ENV"
          echo "triple=$triple" >> "$GITHUB_ENV"
          echo "the workspace says $version, built for $triple"

          # A tag that does not match the workspace is a release whose file
          # names would lie about what is inside them. A pre-release suffix
          # is allowed — `v0.1.0-rc1` for 0.1.0 — because that is how a
          # release gets rehearsed; a different version is not.
          if [ -n "${TAG:-}" ] && [ "${TAG#"v$version"}" = "$TAG" ]; then
            echo "tag $TAG is not v$version or a pre-release of it:" \
                 "bump workspace.package.version, or tag what the workspace says" >&2
            exit 1
          fi

      # The three numbers an operator cannot get out of a binary and has had
      # to ask us for. `RECORD_VERSION` decides whether rolling an image back
      # across this release is safe: a hub reads only a state root whose
      # records carry exactly its own number, and sets aside any other.
      # `LAYOUT_VERSION` is the state root itself rather than the records in
      # it, and it is the one of the three with no migration path at all: the
      # hub refuses a root of another layout before it binds its port,
      # nothing converts a root in either direction, and the check is
      # equality and not a floor, so the rollback is refused the same way. It
      # is on a line of its own below because a script matching two of three
      # numbers would conclude a move was safe when it was not.
      # `PROTOCOL_VERSION` decides whether a runner and a hub of two
      # different builds talk at all. All three are read out of the source
      # this release is built from, for the same reason the version above is
      # read out of the workspace: a number typed into this file, or into a
      # prose file, can disagree with the binaries it ships beside, and a
      # number read here cannot. `nix eval` is not the route — no flake
      # attribute carries any of them, and inventing one would put a regex
      # over a Rust file into the build's contract to serve a release note —
      # so they are read where they are declared.
      - name: the protocol, the record and the layout version, from the source
        run: |
          set -euo pipefail
          proto_src=herd-proto/src/lib.rs
          record_src=herd-hub/src/job.rs
          layout_src=herd-hub/src/store.rs
          protocol_version=$(sed -n \
            's/^pub const PROTOCOL_VERSION: u32 = \([0-9]\{1,\}\);.*$/\1/p' \
            "$proto_src")
          record_version=$(sed -n \
            's/^pub const RECORD_VERSION: u32 = \([0-9]\{1,\}\);.*$/\1/p' \
            "$record_src")
          layout_version=$(sed -n \
            's/^pub const LAYOUT_VERSION: u32 = \([0-9]\{1,\}\);.*$/\1/p' \
            "$layout_src")

          # One number each, or the release stops here. A line that silently
          # came out empty would be worse than no line at all: the body would
          # carry `RECORD_VERSION:` with nothing after it, and the script this
          # exists for would match nothing and conclude nothing while looking
          # like it had checked. The pattern below refuses an empty value, a
          # non-numeric one, and two declarations at once — a second match
          # brings a newline with it, and a newline is not a digit. What it
          # tolerates is anything after the semicolon, a trailing comment
          # included: that still declares the same number, and a tag is the
          # wrong place to find out somebody added one.
          for found in \
            "PROTOCOL_VERSION:$protocol_version:$proto_src" \
            "RECORD_VERSION:$record_version:$record_src" \
            "LAYOUT_VERSION:$layout_version:$layout_src"; do
            name=${found%%:*}
            rest=${found#*:}
            value=${rest%%:*}
            src=${rest#*:}
            case "$value" in
              "" | *[!0-9]*)
                echo "no single '$name' declaration read out of $src:" \
                     "found '$value', which is not a number" >&2
                exit 1
                ;;
            esac
          done

          echo "protocol_version=$protocol_version" >> "$GITHUB_ENV"
          echo "record_version=$record_version" >> "$GITHUB_ENV"
          echo "layout_version=$layout_version" >> "$GITHUB_ENV"
          echo "the source says PROTOCOL_VERSION $protocol_version," \
               "RECORD_VERSION $record_version," \
               "LAYOUT_VERSION $layout_version"

      # ~1 minute, and no toolchain is installed to do it: `pkgsStatic` is
      # nixpkgs' own musl cross set, so D12 still holds and the musl rustc,
      # cargo, gcc and binutils come out of the public cache.
      - name: build the three binaries, static against musl
        run: nix build .#static --print-build-logs

      - name: take them out of the store
        run: |
          set -euo pipefail
          mkdir -p bin
          for b in herd-runner herdctl herd-hub; do
            # A copy, writable and executable: a store path is 0555 and read
            # only, and these are about to be mounted into a container and
            # uploaded.
            install -m 0755 "result/bin/$b" "bin/$b"
          done
          ls -l bin

      # The assertion that keeps this workflow honest. A change that quietly
      # makes these binaries dynamic again — a dependency growing a C
      # library, `pkgsStatic` dropped in a refactor — must fail the build
      # here rather than ship a release that cannot exec on the machines it
      # was made for. Four questions, because each catches a different way of
      # getting it wrong.
      - name: assert every binary is statically linked
        run: |
          set -uo pipefail
          fail=0
          for b in bin/*; do
            echo "--- $b"
            file -b "$b"
            ldd "$b" 2>&1 || true
            readelf -ld "$b" | grep -E 'INTERP|NEEDED|Shared library' || true

            if ! file -b "$b" | grep -q 'static'; then
              echo "NOT STATIC: file(1) does not call $b static" >&2
              fail=1
            fi
            if ! ldd "$b" 2>&1 | grep -qE 'not a dynamic executable|statically linked'; then
              echo "NOT STATIC: ldd(1) found a dynamic loader for $b" >&2
              fail=1
            fi
            # The one that cannot be talked around: a binary with a
            # PT_INTERP segment names an interpreter, and on a host that
            # does not have that interpreter it does not start at all.
            if readelf -l "$b" | grep -q 'INTERP'; then
              echo "NOT STATIC: $b has a PT_INTERP segment" >&2
              fail=1
            fi
            # And no Nix store path anywhere in the bytes: that is how the
            # default packages fail, and a static binary that still names one
            # is a static binary that was built against something it will not
            # find.
            if grep -qa '/nix/store' "$b"; then
              echo "NOT PORTABLE: $b names a /nix/store path" >&2
              fail=1
            fi
          done
          exit "$fail"

      # Static or not, the only proof that counts is a binary doing its job
      # on a distribution that has never had Nix on it. Two of them, with
      # different C libraries, so neither "it happened to find a glibc" nor
      # "it was really a musl host all along" can explain a pass:
      # `archlinux` is glibc, `alpine` is musl, and neither has a /nix/store.
      #
      # `--user 1000:1000` because a runner refuses to start as root
      # (privilege.rs), which is also true of the image's default user.
      # scripts/release-smoke.sh says what it proves; it is a hub, a runner
      # and two real jobs, not `--help` three times.
      - name: run them on Arch Linux, which has no Nix
        run: |
          docker run --rm --user 1000:1000 -e HOME=/tmp \
            -v "$PWD/bin:/herd:ro" \
            -v "$PWD/scripts/release-smoke.sh:/release-smoke.sh:ro" \
            archlinux:latest /release-smoke.sh /herd

      - name: run them on Alpine, which has no Nix and no glibc
        run: |
          docker run --rm --user 1000:1000 -e HOME=/tmp \
            -v "$PWD/bin:/herd:ro" \
            -v "$PWD/scripts/release-smoke.sh:/release-smoke.sh:ro" \
            alpine:latest /release-smoke.sh /herd

      # The names carry the version and the target triple, so a file on
      # somebody's disk six months from now still says what it is. SHA256SUMS
      # is what lets a reader verify what they downloaded instead of trusting
      # a URL: `sha256sum -c SHA256SUMS` in the directory they downloaded
      # into. The hub image's archive is added to this same file further
      # down, once it has been built and proved; a reader who downloaded only
      # the binaries checks them with `sha256sum --ignore-missing -c`.
      - name: name them and sum them
        run: |
          set -euo pipefail
          mkdir -p dist
          for b in herd-runner herdctl herd-hub; do
            install -m 0755 "bin/$b" "dist/$b-$version-$triple"
          done
          cd dist
          # `herd*` and not `herd-*`: `herdctl` has no hyphen, and the first
          # release this workflow cut shipped a SHA256SUMS of two binaries
          # out of three because of it. Hence the count below — a sums file
          # that silently covers less than it should is exactly the kind of
          # green this workflow exists to refuse.
          sha256sum herd* > SHA256SUMS
          cat SHA256SUMS
          summed=$(wc -l < SHA256SUMS)
          if [ "$summed" -ne 3 ]; then
            echo "SHA256SUMS covers $summed files, not 3" >&2
            exit 1
          fi

      # Every run leaves the binaries behind, tag or no tag: that is what
      # makes a hand-run useful, and what lets this workflow be tested
      # without creating a release.
      - uses: actions/upload-artifact@v4
        with:
          name: herd-${{ env.version }}-${{ env.triple }}
          path: dist/
          if-no-files-found: error

      # ---------------------------------------------------------------
      # The floor. Everything above is the binaries; everything below is the
      # hub's image, and it comes *after* the release exists on purpose
      # (D162). Three tags in a row published nothing because a step about
      # the image failed before this point; that cannot happen again, because
      # from here on a failure costs the archive and never the binaries.
      # ---------------------------------------------------------------

      # The body in pieces, so that the half promising the archive can be
      # added later, once the archive is really attached. A release that
      # describes an asset it does not have is worse than a release with
      # three files and no fourth.
      - name: write the release body, the half about the binaries
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The dev preamble, and an empty file on every other path so that
          # the two `cat`s that assemble the body never have to know which
          # lane they are on. It goes **first** in the body, above the
          # install lines, because a reader deciding whether to put this on
          # a production runner has to meet "this is not a release" before
          # they meet a `sha256sum` command that looks like a release's.
          : > body-dev.md
          if [ "$DEV" = "true" ]; then
            # Which branch, asked of GitHub rather than of git: a tag push
            # checks out one commit, so the local clone knows no branches,
            # and fetching the whole history to learn one name would cost
            # the lane the seconds it exists to save. The answer can be
            # empty — the branch may have moved on in the minutes since the
            # tag was pushed — and an empty answer is printed as one rather
            # than guessed at.
            branch=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.sha }}/branches-where-head" \
              --jq 'map(.name) | join(", ")' 2>/dev/null || true)
            if [ -z "$branch" ]; then
              branch="no branch has this commit at its head any more"
            fi

            {
              echo "## This is a development build. It is not a release."
              echo
              echo "\`$TAG\` was built from **$branch**, commit"
              echo "\`${{ github.sha }}\`, and published straight off that"
              echo "branch. There was no pull request and no review, and"
              echo "**the merge gate did not run on it here**: not"
              echo "\`nix flake check\`, not \`cargo fmt\`, not"
              echo "\`cargo clippy\`, not the suite. Those were run on the"
              echo "branch, on the machine the change was written on,"
              echo "before this tag was pushed, and that run is the whole"
              echo "of the proof behind these bytes. If it was not made,"
              echo "nothing in this build knows it."
              echo
              echo "What *did* run is everything below the gate, unchanged"
              echo "and not a second implementation of it: the same Nix"
              echo "derivations a release is built from, the same assertion"
              echo "that every binary is statically linked and names no"
              echo "Nix store path, the same hub-runner-two-jobs smoke"
              echo "inside an \`archlinux\` container and an \`alpine\` one,"
              echo "and the same hub started out of the loaded image"
              echo "archive. So these artefacts are as portable and as"
              echo "runnable as a release's. What is missing is the"
              echo "opinion of anybody but the person who tagged it."
              echo
              echo "It is marked a pre-release, so nothing that asks this"
              echo "repository for its *latest* release can be handed it by"
              echo "accident. A dev build is taken on purpose or not at all."
              echo
              echo "**What it is for.** Finding out on a real host, today,"
              echo "whether a change works and what else it moved. Almost"
              echo "everything in the notice further down was learnt that"
              echo "way and could not have been learnt any other. The hour"
              echo "between knowing a fix and being able to install it is"
              echo "what this lane spends CI's seven minutes to buy back"
              echo "(D172)."
              echo
              echo "**One machine, not a fleet.** Put it on a host whose"
              echo "owner is watching it and can put it back. A dev build"
              echo "that proves itself does not get promoted: the change"
              echo "goes through a pull request and a tag of its own like"
              echo "anything else, and that tag is what a fleet runs."
              echo
              echo "**If it misbehaves**, there is nothing to fix in place."
              echo "Install the newest tag with no \`-dev\` in it. Compare"
              echo "its \`RECORD_VERSION\` and its \`LAYOUT_VERSION\` with"
              echo "the two printed below first: if either differs, going"
              echo "back cannot read the state root this build wrote, and"
              echo "what that costs is said below. Then say what you saw,"
              echo "naming the **commit** above and not the version —"
              echo "several dev builds carry the same version, and the"
              echo "version alone would not tell us which one you ran."
              echo
              echo "---"
              echo
            } > body-dev.md
          fi

          {
            echo "Static x86_64 Linux binaries for Herd $version, linked"
            echo "against musl: they run on any distribution and need no Nix."
            echo
            echo "Verify what you downloaded, then read the notice below:"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "chmod +x herd-runner-$version-$triple"
            echo '```'
            echo
            echo "The three numbers this build carries, read out of the"
            echo "source it was built from:"
            echo
            echo '```'
            echo "RECORD_VERSION: $record_version"
            echo "LAYOUT_VERSION: $layout_version"
            echo "PROTOCOL_VERSION: $protocol_version"
            echo '```'
            echo
            echo "\`RECORD_VERSION\` is the hub's state volume, and therefore"
            echo "whether rolling back to an earlier image is safe;"
            echo "\`PROTOCOL_VERSION\` is whether a runner and a hub of two"
            echo "different builds talk at all. \"The two numbers\" in the"
            echo "notice below says what to do about each."
            echo
            echo "\`LAYOUT_VERSION\` is the state root itself rather than the"
            echo "records in it, and it is the one of the three with **no"
            echo "migration path at all**: the hub refuses a root of another"
            echo "layout before it binds its port, nothing converts a root in"
            echo "either direction, and the check is equality and not a"
            echo "floor, so the rollback across it is refused the same way."
            echo "If it differs from the one on the release you are running,"
            echo "take \`herd-hub report --state-dir\` off your root with the"
            echo "**old** release's binary first, then move the root aside —"
            echo "do not convert it, do not delete it — and give the new hub"
            echo "an empty volume. The notice below's \"The two numbers\""
            echo "section predates this line and covers the other two."
            echo
            echo "All three lines are meant to be matched:"
            echo "\`^RECORD_VERSION: [0-9]+\$\`."
            echo
          } > body-head.md

          # The release's own notes, written by a person and kept in the
          # tree: `deploy/release-notes/<version>.md`, the version read off
          # the workspace above. It is the human half of the page, and it
          # goes between the half generated here and the standing notice
          # below — so a reader meets what this release is before the
          # notice that is true of every release.
          #
          # It is a file and not a paste because the paste was tried and
          # lost: v0.4.0 was published carrying none of the notes written
          # for it, both operator cautions included, because the step that
          # supplied them was somebody remembering, and the person briefed
          # for the tag was not briefed for the paste (ORCH-162). What
          # makes this a guard rather than a second convention is not here:
          # `scripts/check-docs.sh` requires the file for the workspace's
          # version, so a bump that forgets its notes goes red on a branch,
          # before a tag is pushed.
          #
          # Absent means no half, exactly as it does for the dev preamble
          # above, and the `: >` is what makes that true: a run with no
          # notes file — a rehearsal, or a tag replayed from a later commit
          # — publishes without the half instead of failing. The body is
          # never allowed to cost a tag its binaries (D162, and the three
          # tags named at the top of this file). The warning is loud in the
          # run's summary and costs nothing.
          : > body-notes.md
          notes="deploy/release-notes/$version.md"
          if [ -s "$notes" ]; then
            {
              cat "$notes"
              echo
              echo "---"
              echo
            } > body-notes.md
            echo "release notes: $notes, $(wc -l < "$notes") lines"
          else
            echo "::warning title=No release notes::$notes is missing or" \
                 "empty; this release is being published with no notes of" \
                 "its own. check-docs.sh requires it on a branch, so this" \
                 "should be unreachable for a tag cut from main."
          fi

          {
            # The commit this run checked out, and not `$TAG`: the notice
            # quoted below was `cat` out of *this* tree, and a hand-run can
            # publish an existing tag from a later commit — `actions/checkout`
            # takes the ref the run was started on, not the ref named in the
            # input. Linking the tag would then point a reader at a different
            # notice from the one printed underneath it. One line: a markdown
            # link destination cannot be broken across two.
            echo "The notice in full, as of the commit that built this: <https://github.com/${{ github.repository }}/blob/${{ github.sha }}/deploy/release-notice.md>"
            echo
            echo "---"
            echo
            cat deploy/release-notice.md
          } > body-tail.md

          cat body-dev.md body-head.md body-notes.md body-tail.md > release-body.md

      # `gh` rather than a third-party action: it is on the runner already,
      # and a release is the one step here that cannot be undone quietly.
      # The notice is quoted into the body rather than linked, because
      # whoever downloads a tarball six months from now may not have the
      # repository — and linked, as well, so they can read the current one.
      - name: publish the release, with the binaries
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag carrying a suffix — `v0.1.0-rc1`, and the throwaway tag this
          # workflow was first proven with — is published as a pre-release,
          # so a rehearsal never sits in the place a reader looks for the
          # current version. A dev build is one whatever its tag looks like:
          # that flag is the whole of what stops an updater asking this
          # repository for its latest release from installing an untested
          # build on a production runner, so it is not left resting on a
          # hyphen somebody could spell differently (D172).
          prerelease=
          if [ "$DEV" = "true" ] || [ "${TAG#*-}" != "$TAG" ]; then
            prerelease=--prerelease
          fi

          # --notes-file, never --notes with a shell variable: the notice is
          # a long document with backticks and dollars in it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-body.md $prerelease
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Herd $TAG" \
              --notes-file release-body.md \
              --verify-tag $prerelease
          fi
          gh release view "$TAG"

      # ---------------------------------------------------------------
      # The hub's image. The subject from here down is one artefact:
      # `packages.hub-image`, the same derivation an operator can still build
      # by hand (`deploy/README.md`). There is no Dockerfile and no second
      # way to build the hub, because two ways to build it is how the thing
      # deployed stops being the thing tested — that part of D153 stands
      # unchanged. What changed is only where the bytes go: onto the release
      # as an archive, not into a registry (D162).
      # ---------------------------------------------------------------

      - name: build the hub's image, from the flake and nowhere else
        run: nix build .#hub-image --print-build-logs --out-link hub-image

      # The archive names itself, and the name is the deployment's contract:
      # `docker load` prints the tag it carries, and that tag is what the
      # operator puts in `HERD_HUB_IMAGE`. `nix/hub-image.nix` takes it from
      # the workspace version the same way the binaries above take theirs, so
      # it cannot drift — which is exactly why it is worth asserting rather
      # than assuming: a drift would ship an archive tagged for a hub it does
      # not contain. One tag and no second one, which is also where a
      # `latest` would show up if anybody ever added one (D153 says why there
      # is none, and that reason has not moved).
      - name: assert the archive carries herd-hub:$version, and only that
        run: |
          set -euo pipefail
          tags=$(tar -xzOf hub-image manifest.json | jq -r '.[].RepoTags[]')
          printf 'the archive says: %s\n' "$tags"
          if [ "$tags" != "herd-hub:$version" ]; then
            echo "expected exactly herd-hub:$version in the archive" >&2
            exit 1
          fi

      # The one proof the image has, now that nothing is pushed and nothing
      # is pulled back — and it is the right one, because it is exactly what
      # an operator does with the attached archive: `docker load`, then run
      # it. scripts/image-smoke.sh is a hub in the container — read-only
      # root, a volume on /var/lib/herd, the image's own non-root user,
      # exactly the shape `deploy/docker-compose.yml` gives it — with the
      # static runner and `herdctl` built above dialling it on the host, and
      # two real jobs through it. It needs no credentials, so it runs on
      # every run including a hand-run with no tag.
      - name: load the archive and run a hub out of it
        run: |
          set -euo pipefail
          docker load < hub-image
          ./scripts/image-smoke.sh "herd-hub:$version" "$PWD/bin"

      # Named for a person's download directory, and summed in the same
      # SHA256SUMS as the binaries, because it is a download like any other.
      # `install` and not a symlink: `hub-image` points into the Nix store
      # and `gh release upload` would follow it to a name nobody chose.
      - name: name the archive and add it to SHA256SUMS
        run: |
          set -euo pipefail
          archive="herd-hub-image-$version.tar.gz"
          install -m 0644 hub-image "dist/$archive"
          ls -l "dist/$archive"
          cd dist
          sha256sum "$archive" >> SHA256SUMS
          cat SHA256SUMS
          summed=$(wc -l < SHA256SUMS)
          if [ "$summed" -ne 4 ]; then
            echo "SHA256SUMS covers $summed files, not 4" >&2
            exit 1
          fi

      # So that a hand-run with no tag still hands back an archive somebody
      # can `docker load`: the rehearsal is only worth running if what it
      # produces can be inspected. This artifact's `SHA256SUMS` is the
      # complete four-line one; the binaries' artifact above was uploaded
      # before the archive existed and its copy covers three.
      - uses: actions/upload-artifact@v4
        with:
          name: herd-hub-image-${{ env.version }}
          path: |
            dist/herd-hub-image-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: attach the archive to the release, and say so in the body
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="herd-hub-image-$version.tar.gz"
          # SHA256SUMS goes up again: it has a fourth line now.
          gh release upload "$TAG" "dist/$archive" dist/SHA256SUMS --clobber

          {
            echo "The hub is not one of the three binaries for most people:"
            echo "it is a container image, attached to this release as"
            echo "\`$archive\` and loaded with \`docker load\`. There is no"
            echo "registry to pull from and no credentials to hold (D162)."
            echo
            echo '```sh'
            echo "docker load < $archive        # Loaded image: herd-hub:$version"
            echo '```'
            echo
            echo "Then name that tag in the \`.env\` beside"
            echo "\`deploy/docker-compose.yml\`, which requires it and"
            echo "defaults to nothing:"
            echo
            echo '```sh'
            echo "HERD_HUB_IMAGE=herd-hub:$version"
            echo '```'
            echo
            echo "and \`docker compose up -d\`. Skip \`docker compose pull\`:"
            echo "that tag is local to the machine that loaded it, and"
            echo "pulling it would fail. \`deploy/README.md\` walks the first"
            echo "start, including the two ownership failures it actually"
            echo "hits."
            echo
          } > body-image.md

          # Every piece again, not just the new one: this `cat` replaces the
          # body the step above published, so a piece left out here is a
          # piece the release loses a few minutes after it had it.
          # `check-docs.sh` asserts that both of these lines carry the notes
          # between the generated half and the notice.
          cat body-dev.md body-head.md body-image.md body-notes.md body-tail.md > release-body.md
          gh release edit "$TAG" --notes-file release-body.md
          gh release view "$TAG"
