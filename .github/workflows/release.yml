# What a release is: three statically linked binaries and a SHA256SUMS, built
# on a pushed tag, plus `deploy/release-notice.md` quoted into the release
# body. The first consumer's team deploys on their own machines, so a release
# has to be something a person can download onto an Arch box or a WSL2 PC and
# run — which the flake's default packages are not: they are linked against
# glibc out of the Nix store and do not exec on a host without Nix.
#
# Since D153 it is also **the hub's container image on Docker Hub**, pushed
# from the very archive `packages.hub-image` builds — one image, built one
# way, so the thing deployed is the thing that was tested. The image is
# pushed *before* the GitHub release is created, so that a tag never leaves
# binaries published and an image missing: see D153 for the ordering and for
# what a failure in the middle leaves behind.
#
# This file is **not** the merge gate. `ci.yml` is, with its `check` and
# `docs` jobs, and nothing here touches it.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to publish the release on, e.g. v0.1.0. Left empty, the
          binaries are built and verified and attached to this run, and no
          release is created.
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled: a half-uploaded release is worse than a slow one.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # One job and not three, deliberately. The binaries, the image and the
  # release are one release, and steps in one job run in an order a reader
  # can see; jobs would need the artefacts passed between them and would let
  # GitHub decide what runs when.
  binaries:
    name: static binaries and the hub image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One place where "which tag, if any" is decided. A tag push releases
      # under its own name; a hand-run releases only if it was given one.
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
      # Where the image goes. A repository **variable** and not a secret,
      # deliberately: a Docker Hub namespace is public the instant anything
      # is pushed to it, it is in every image reference a deployer types,
      # and holding it in a secret would make GitHub mask it — so every
      # line below, including skopeo's own error text, would read
      # `docker.io/***/herd-hub` and a failed push could not be diagnosed
      # from its log. The token is the secret; the name is not (D153).
      IMAGE_REPO: docker.io/${{ vars.DOCKERHUB_USERNAME }}/herd-hub
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The version comes from `Cargo.toml`'s `workspace.package.version`,
      # read through the flake — `flake.nix` reads it once and every package
      # takes it from there, so this is the same figure as the hub image's
      # tag and cannot be a number somebody typed here. The triple comes from
      # the derivation's own host platform for the same reason.
      - name: the version and the target, from the workspace
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#static.version)
          triple=$(nix eval --raw .#static.stdenv.hostPlatform.config)
          echo "version=$version" >> "$GITHUB_ENV"
          echo "triple=$triple" >> "$GITHUB_ENV"
          echo "the workspace says $version, built for $triple"

          # A tag that does not match the workspace is a release whose file
          # names would lie about what is inside them. A pre-release suffix
          # is allowed — `v0.1.0-rc1` for 0.1.0 — because that is how a
          # release gets rehearsed; a different version is not.
          if [ -n "${TAG:-}" ] && [ "${TAG#v$version}" = "$TAG" ]; then
            echo "tag $TAG is not v$version or a pre-release of it:" \
                 "bump workspace.package.version, or tag what the workspace says" >&2
            exit 1
          fi

      # Before anything is built, and long before anything is published: a
      # tag that publishes the binaries and then finds it cannot push the
      # image is the half-release D153 exists to prevent, and the cheapest
      # way to never have one is to refuse the run while nothing has been
      # done. Names only, never a value, and no `set -x` anywhere in this
      # file: a token that reaches a log line is a leaked token
      # (invariant 7). GitHub masks a secret it recognises, but a workflow
      # should not be relying on that.
      #
      # The two live in two different tabs of the same settings page, which
      # is exactly the kind of thing nobody should have to work out at the
      # moment a release has stopped — so each line below names its own tab.
      - name: the Docker Hub credentials this tag needs, by name
        if: env.TAG != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            missing=1
            echo "this tag publishes the hub's image and cannot:" >&2
            echo "github.com/${{ github.repository }}/settings -> Secrets" >&2
            echo "and variables -> Actions, where the two live in two" >&2
            echo "different tabs." >&2
            echo >&2
          fi
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "MISSING, on the 'Variables' tab — repository variable" >&2
            echo "  DOCKERHUB_USERNAME: the Docker Hub account that owns" >&2
            echo "  the public herd-hub repository. A variable and not a" >&2
            echo "  secret on purpose: it is in every image reference a" >&2
            echo "  deployer types, and masking it would make this very" >&2
            echo "  log unreadable." >&2
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "MISSING, on the 'Secrets' tab — repository secret" >&2
            echo "  DOCKERHUB_TOKEN: a Docker Hub access token scoped to" >&2
            echo "  that one repository, Read & Write. Never the account" >&2
            echo "  password, and never an account-wide token." >&2
          fi
          if [ "$missing" -ne 0 ]; then
            echo >&2
            echo "deploy/release-notice.md says it in full. Nothing of this" >&2
            echo "release has been published: set it and re-run this tag." >&2
            exit 1
          fi
          echo "the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN"
          echo "secret are both set; the image goes to $IMAGE_REPO:$version"

      # ~1 minute, and no toolchain is installed to do it: `pkgsStatic` is
      # nixpkgs' own musl cross set, so D12 still holds and the musl rustc,
      # cargo, gcc and binutils come out of the public cache.
      - name: build the three binaries, static against musl
        run: nix build .#static --print-build-logs

      - name: take them out of the store
        run: |
          set -euo pipefail
          mkdir -p bin
          for b in herd-runner herdctl herd-hub; do
            # A copy, writable and executable: a store path is 0555 and read
            # only, and these are about to be mounted into a container and
            # uploaded.
            install -m 0755 "result/bin/$b" "bin/$b"
          done
          ls -l bin

      # The assertion that keeps this workflow honest. A change that quietly
      # makes these binaries dynamic again — a dependency growing a C
      # library, `pkgsStatic` dropped in a refactor — must fail the build
      # here rather than ship a release that cannot exec on the machines it
      # was made for. Four questions, because each catches a different way of
      # getting it wrong.
      - name: assert every binary is statically linked
        run: |
          set -uo pipefail
          fail=0
          for b in bin/*; do
            echo "--- $b"
            file -b "$b"
            ldd "$b" 2>&1 || true
            readelf -ld "$b" | grep -E 'INTERP|NEEDED|Shared library' || true

            if ! file -b "$b" | grep -q 'static'; then
              echo "NOT STATIC: file(1) does not call $b static" >&2
              fail=1
            fi
            if ! ldd "$b" 2>&1 | grep -qE 'not a dynamic executable|statically linked'; then
              echo "NOT STATIC: ldd(1) found a dynamic loader for $b" >&2
              fail=1
            fi
            # The one that cannot be talked around: a binary with a
            # PT_INTERP segment names an interpreter, and on a host that
            # does not have that interpreter it does not start at all.
            if readelf -l "$b" | grep -q 'INTERP'; then
              echo "NOT STATIC: $b has a PT_INTERP segment" >&2
              fail=1
            fi
            # And no Nix store path anywhere in the bytes: that is how the
            # default packages fail, and a static binary that still names one
            # is a static binary that was built against something it will not
            # find.
            if grep -qa '/nix/store' "$b"; then
              echo "NOT PORTABLE: $b names a /nix/store path" >&2
              fail=1
            fi
          done
          exit "$fail"

      # Static or not, the only proof that counts is a binary doing its job
      # on a distribution that has never had Nix on it. Two of them, with
      # different C libraries, so neither "it happened to find a glibc" nor
      # "it was really a musl host all along" can explain a pass:
      # `archlinux` is glibc, `alpine` is musl, and neither has a /nix/store.
      #
      # `--user 1000:1000` because a runner refuses to start as root
      # (privilege.rs), which is also true of the image's default user.
      # scripts/release-smoke.sh says what it proves; it is a hub, a runner
      # and two real jobs, not `--help` three times.
      - name: run them on Arch Linux, which has no Nix
        run: |
          docker run --rm --user 1000:1000 -e HOME=/tmp \
            -v "$PWD/bin:/herd:ro" \
            -v "$PWD/scripts/release-smoke.sh:/release-smoke.sh:ro" \
            archlinux:latest /release-smoke.sh /herd

      - name: run them on Alpine, which has no Nix and no glibc
        run: |
          docker run --rm --user 1000:1000 -e HOME=/tmp \
            -v "$PWD/bin:/herd:ro" \
            -v "$PWD/scripts/release-smoke.sh:/release-smoke.sh:ro" \
            alpine:latest /release-smoke.sh /herd

      # The names carry the version and the target triple, so a file on
      # somebody's disk six months from now still says what it is. SHA256SUMS
      # is what lets a reader verify what they downloaded instead of trusting
      # a URL: `sha256sum -c SHA256SUMS` in the directory they downloaded
      # into.
      - name: name them and sum them
        run: |
          set -euo pipefail
          mkdir -p dist
          for b in herd-runner herdctl herd-hub; do
            install -m 0755 "bin/$b" "dist/$b-$version-$triple"
          done
          cd dist
          # `herd*` and not `herd-*`: `herdctl` has no hyphen, and the first
          # release this workflow cut shipped a SHA256SUMS of two binaries
          # out of three because of it. Hence the count below — a sums file
          # that silently covers less than it should is exactly the kind of
          # green this workflow exists to refuse.
          sha256sum herd* > SHA256SUMS
          cat SHA256SUMS
          summed=$(wc -l < SHA256SUMS)
          if [ "$summed" -ne 3 ]; then
            echo "SHA256SUMS covers $summed files, not 3" >&2
            exit 1
          fi

      # Every run leaves the binaries behind, tag or no tag: that is what
      # makes a hand-run useful, and what lets this workflow be tested
      # without creating a release.
      - uses: actions/upload-artifact@v4
        with:
          name: herd-${{ env.version }}-${{ env.triple }}
          path: dist/
          if-no-files-found: error

      # ---------------------------------------------------------------
      # The hub's image. From here to the release below, the subject is one
      # artefact: `packages.hub-image`, the same derivation an operator can
      # still build by hand (`deploy/README.md`). There is no Dockerfile and
      # no second way to build it, because two ways to build the hub is how
      # the thing deployed stops being the thing tested (D153).
      # ---------------------------------------------------------------

      - name: build the hub's image, from the flake and nowhere else
        run: nix build .#hub-image --print-build-logs --out-link hub-image

      # The archive names itself, and the name is the deployment's contract.
      # `nix/hub-image.nix` takes the tag from the workspace version the same
      # way the binaries above take theirs, so this cannot drift — which is
      # exactly why it is worth asserting rather than assuming: if it ever
      # does drift, a release would push an image tagged for a hub it does
      # not contain. One tag and no second one, which is also where a
      # `latest` would show up if anybody ever added one (D153 says why there
      # is none).
      - name: assert the archive carries herd-hub:$version, and only that
        run: |
          set -euo pipefail
          tags=$(tar -xzOf hub-image manifest.json | jq -r '.[].RepoTags[]')
          printf 'the archive says: %s\n' "$tags"
          if [ "$tags" != "herd-hub:$version" ]; then
            echo "expected exactly herd-hub:$version in the archive" >&2
            exit 1
          fi

      # Proven before it is pushed, and proven on every run including a
      # hand-run with no tag: this step needs no credentials, so the image
      # half of a release can be exercised without publishing anything.
      # scripts/image-smoke.sh is a hub in the container — read-only root, a
      # volume on /var/lib/herd, the image's own non-root user, exactly the
      # shape `deploy/docker-compose.yml` gives it — with the static runner
      # and `herdctl` built above dialling it on the host, and two real jobs
      # through it.
      - name: run a hub out of the image, before anything is pushed
        run: |
          set -euo pipefail
          docker load < hub-image
          ./scripts/image-smoke.sh "herd-hub:$version" "$PWD/bin"

      # `skopeo copy` straight from the archive, and not `docker load` then
      # `docker tag` then `docker push`. Three reasons, in order of weight
      # (D153): the source is a *file* and not a name in a shared local image
      # store, so there is nothing else this step could push by accident; the
      # manifest the flake built is the manifest the registry stores, digest
      # unchanged, because the archive's layers are already the compressed
      # blobs; and the token goes in through `--password-stdin` into an
      # authfile of this job's own rather than onto an argv or into
      # `~/.docker/config.json`.
      #
      # `--insecure-policy` is about *signatures*, not transport: it means
      # "no containers-policy.json to consult", which is what `docker push`
      # also does. TLS to Docker Hub is untouched.
      - name: push it to Docker Hub
        if: env.TAG != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(mktemp)
          trap 'rm -f "$auth"' EXIT

          printf '%s' "$DOCKERHUB_TOKEN" |
            nix develop .#release --command skopeo login \
              --authfile "$auth" \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin docker.io

          nix develop .#release --command skopeo --insecure-policy copy \
            --authfile "$auth" \
            --digestfile image-digest.txt \
            "docker-archive:hub-image" \
            "docker://$IMAGE_REPO:$version"

          digest=$(cat image-digest.txt)
          echo "digest=$digest" >> "$GITHUB_ENV"
          echo "pushed, and the registry now holds $digest"

      # The downloader's half, and the only step that proves what is on
      # Docker Hub rather than what was on this runner. By digest, not by
      # tag: a tag is a name somebody can move, a digest is the bytes. The
      # local tag goes first so that nothing already here can answer in the
      # registry's place.
      - name: pull it back by digest and run a hub out of that
        if: env.TAG != ''
        run: |
          set -euo pipefail
          docker rmi "herd-hub:$version" >/dev/null 2>&1 || true
          ref="$IMAGE_REPO@$digest"
          docker pull "$ref"
          ./scripts/image-smoke.sh "$ref" "$PWD/bin"

      # `gh` rather than a third-party action: it is on the runner already,
      # and a release is the one step here that cannot be undone quietly.
      # The notice is quoted into the body rather than linked, because
      # whoever downloads a tarball six months from now may not have the
      # repository — and linked, as well, so they can read the current one.
      - name: publish the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "Static x86_64 Linux binaries for Herd $version, linked"
            echo "against musl: they run on any distribution and need no Nix."
            echo
            echo "Verify what you downloaded, then read the notice below:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "chmod +x herd-runner-$version-$triple"
            echo '```'
            echo
            echo "The hub is not one of these three for most people: it is a"
            echo "container image, published on Docker Hub by this same tag"
            echo "and proved by pulling it back down and running two real"
            echo "jobs through it. Deploying it is a pull and an up:"
            echo
            echo '```sh'
            echo "docker pull $IMAGE_REPO:$version"
            # The digest as well, because a tag is a name somebody can move
            # and a digest is the bytes. `deploy/env.example` accepts either.
            echo "docker pull $IMAGE_REPO@$digest"
            echo '```'
            echo
            # One line: a markdown link destination cannot be broken across
            # two.
            echo "The notice in full, as of this tag: <https://github.com/${{ github.repository }}/blob/$TAG/deploy/release-notice.md>"
            echo
            echo "---"
            echo
            cat deploy/release-notice.md
          } > release-body.md

          # A tag carrying a suffix — `v0.1.0-rc1`, and the throwaway tag this
          # workflow was first proven with — is published as a pre-release,
          # so a rehearsal never sits in the place a reader looks for the
          # current version.
          prerelease=
          if [ "${TAG#*-}" != "$TAG" ]; then
            prerelease=--prerelease
          fi

          # --notes-file, never --notes with a shell variable: the notice is
          # a long document with backticks and dollars in it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-body.md $prerelease
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Herd $TAG" \
              --notes-file release-body.md \
              --verify-tag $prerelease
          fi
          gh release view "$TAG"
