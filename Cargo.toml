[workspace]
members = ["herd-proto", "herd-hub", "herd-runner", "herdctl"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
publish = false
# Q10, decided 2026-10-16: Apache-2.0 (D141). The verbatim text is in
# LICENSE at the repository root; this field is what tooling reads.
license = "Apache-2.0"

# One version per dependency for the whole workspace: the hub, a runner and
# herdctl must never speak slightly different versions of the same library.
[workspace.dependencies]
herd-proto = { path = "herd-proto" }
herd-hub = { path = "herd-hub" }
herd-runner = { path = "herd-runner" }
herdctl = { path = "herdctl" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
# The runner confines jobs with syscalls the standard library does not reach:
# setsid, nice, ioprio_set, setrlimit, and the write of "0" into a cgroup's
# cgroup.procs between fork and exec (M4). libc is the thin, stable way to
# reach them and shapes nothing about the architecture.
libc = "0.2.180"
# The crypto provider behind `wss://`, named here because nothing names it for
# us. `tokio-tungstenite`'s rustls features pull rustls with
# `default-features = false`, which means **no provider at all**, and
# `ClientConfig::builder()` panics when none is installed — so a `wss://` dial
# would have aborted the process instead of connecting. Enabling `ring` here
# is rustls' documented way to make that choice: the builder installs the
# provider the crate features selected.
#
# `ring` rather than `aws-lc-rs`: it needs a C compiler and nothing else — no
# OpenSSL, no cmake, no system library and no development headers — which is
# what keeps a runner droppable on a strange machine and the Nix packaging
# plain. Only the two crates that dial depend on it; the hub keeps listening
# in plain `ws://` behind the reverse proxy.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }
tokio = "1.53.2"
# Default features here, and TLS asked for by the two crates that dial: see
# `herd-runner/Cargo.toml`. The hub takes this same entry and never wraps its
# listener, because the reverse proxy terminates TLS (D14).
tokio-tungstenite = "0.30.0"
# The consumer declares its commands in TOML, because that is the file format
# they chose for their own tree. Only `herdctl` parses it: the declaration is
# read where the repository already is, so the hub and a runner never see TOML
# and never need a checkout (D106). Easy to swap, shapes nothing.
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde", "std"] }
