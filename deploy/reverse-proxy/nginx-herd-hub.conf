# wss:// for the Herd hub, as a fragment for an nginx that already
# terminates TLS for this host. Assumed proxy: nginx. This is not a server
# configuration — it is the two pieces to paste into the one the operator
# already runs, and nothing else about his server is touched.
#
# **Wrong file for the project's own server**, which runs Traefik v3 behind
# cloudflared: that one is `traefik-herd-hub.yml`, beside this. One file per
# proxy, and only one of them applies to any given host.
#
# What it has to get right, and why:
#
#   * the upgrade handshake, or the connection is answered as plain HTTP;
#   * timeouts that outlast a build, because this connection is held open
#     for the life of a runner and for the whole of a job someone follows.
#     A runner reports health every 15 s (E-40), but a requester following
#     a long link step can see nothing for minutes, and nginx's default
#     proxy_read_timeout is 60 s — which would cut it;
#   * no response buffering, or a job's log arrives in lumps.
#
# TLS itself stays where it already is: Herd never terminates it (D4, D14).

# ---- 1. in the `http` block, once per server -------------------------------
#
# nginx's own recommended map for the Connection header. If this nginx
# already has a `$connection_upgrade` map (NixOS's services.nginx defines
# one as soon as any location sets `proxyWebsockets = true`), skip this.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 2. in the `server` block that already holds the TLS certificate -------
#
# The hub ignores the request path, so this can be a location under the host
# the dashboard already uses. Requesters and runners then dial
# `wss://<host>/herd` — `herdctl --hub`, `herd-runner --hub`.

location /herd {
    # Loopback, because docker compose publishes the hub on loopback only
    # and nothing else on the network can reach it.
    proxy_pass http://127.0.0.1:8787;

    # The upgrade. HTTP/1.1 is required: WebSocket cannot be upgraded on
    # HTTP/1.0, and nginx proxies as 1.0 unless told otherwise.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # An hour of quiet on either side is still a live connection. The hub
    # has liveness clocks of its own — a runner silent for --lost-after is
    # written off (D113) — so the proxy must not be the thing that decides
    # a thirty-minute build is dead.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # A log frame is of no use held in a buffer.
    proxy_buffering off;

    # Connecting is either immediate or broken; do not sit on it.
    proxy_connect_timeout 10s;
}

# ---- another proxy is not the same three things ----------------------------
#
# This file is for a host that runs nginx. **The project's own server runs
# Traefik v3 with cloudflared in front of it, and it has a fragment of its
# own: `traefik-herd-hub.yml`, beside this one.** Use that there, and this
# here; they are alternatives, and neither is a translation of the other.
#
# An earlier version of this note claimed Caddy, Traefik and HAProxy "each
# need exactly this". They do not, and the differences are not cosmetic:
#
#   * **the upgrade.** Traefik v3 and Caddy's `reverse_proxy` handle it
#     inherently and want no header plumbing at all; nginx needs the three
#     directives above precisely because it proxies as HTTP/1.0 and drops
#     hop-by-hop headers. Copying nginx's ritual into Traefik is cargo;
#     omitting it in nginx is a connection answered as plain HTTP.
#   * **the timeouts.** They are not one pair of knobs. In Traefik they are
#     split between *static* per-entrypoint `respondingTimeouts` (the client
#     side, shared with every other service on the host) and a *dynamic*
#     per-service `serversTransport` (the backend side) — a distinction
#     nginx does not have, and the reason a Traefik answer cannot be one
#     `location` block. HAProxy's is `timeout tunnel`, which exists for
#     exactly this case and defaults to `timeout client`/`timeout server`.
#   * **buffering.** nginx buffers responses by default and must be told
#     not to; Traefik and Caddy do not buffer unless a middleware or
#     directive is added.
#
# What is genuinely common to all of them is only the *requirement*: the
# upgrade must reach the hub, no idle window on the path may be shorter
# than Herd's 15 s cadence, nothing may buffer a log, and the certificate
# in front must be publicly trusted (D115). How each proxy is told that
# differs, which is why there is a file per proxy and not a paragraph.
#
# On NixOS, where this nginx is `services.nginx`, the equivalent is one
# virtualHost location with `proxyPass = "http://127.0.0.1:8787"`,
# `proxyWebsockets = true` (which supplies part 1 and the two upgrade
# headers), and the timeouts above in `extraConfig`. Writing that is an
# /etc/nixos change, which is the owner's, not Herd's.
