# wss:// for the Herd hub, as a fragment for an nginx that already
# terminates TLS for this host. Assumed proxy: nginx. This is not a server
# configuration — it is the two pieces to paste into the one the operator
# already runs, and nothing else about his server is touched.
#
# What it has to get right, and why:
#
#   * the upgrade handshake, or the connection is answered as plain HTTP;
#   * timeouts that outlast a build, because this connection is held open
#     for the life of a runner and for the whole of a job someone follows.
#     A runner reports health every 15 s (E-40), but a requester following
#     a long link step can see nothing for minutes, and nginx's default
#     proxy_read_timeout is 60 s — which would cut it;
#   * no response buffering, or a job's log arrives in lumps.
#
# TLS itself stays where it already is: Herd never terminates it (D4, D14).

# ---- 1. in the `http` block, once per server -------------------------------
#
# nginx's own recommended map for the Connection header. If this nginx
# already has a `$connection_upgrade` map (NixOS's services.nginx defines
# one as soon as any location sets `proxyWebsockets = true`), skip this.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 2. in the `server` block that already holds the TLS certificate -------
#
# The hub ignores the request path, so this can be a location under the host
# the dashboard already uses. Requesters and runners then dial
# `wss://<host>/herd` — `herdctl --hub`, `herd-runner --hub`.

location /herd {
    # Loopback, because docker compose publishes the hub on loopback only
    # and nothing else on the network can reach it.
    proxy_pass http://127.0.0.1:8787;

    # The upgrade. HTTP/1.1 is required: WebSocket cannot be upgraded on
    # HTTP/1.0, and nginx proxies as 1.0 unless told otherwise.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # An hour of quiet on either side is still a live connection. The hub
    # has liveness clocks of its own — a runner silent for --lost-after is
    # written off (D113) — so the proxy must not be the thing that decides
    # a thirty-minute build is dead.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # A log frame is of no use held in a buffer.
    proxy_buffering off;

    # Connecting is either immediate or broken; do not sit on it.
    proxy_connect_timeout 10s;
}

# ---- the same three things in another proxy --------------------------------
#
# Caddy, Traefik and HAProxy each need exactly this: HTTP/1.1 with the
# Upgrade and Connection headers passed through, a read/write idle timeout
# of an hour or more, and response buffering off. Caddy's `reverse_proxy`
# does the first by default and needs only the timeouts.
#
# On NixOS, where this nginx is `services.nginx`, the equivalent is one
# virtualHost location with `proxyPass = "http://127.0.0.1:8787"`,
# `proxyWebsockets = true` (which supplies part 1 and the two upgrade
# headers), and the timeouts above in `extraConfig`. Writing that is an
# /etc/nixos change, which is the owner's, not Herd's.
