[package]
name = "herd-hub"
description = "The Herd hub: accepts a runner and requesters, dispatches jobs, relays logs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
herd-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
# flock(2) on the state root: one hub per root, and a lock the kernel drops
# even when the hub is killed (D21). And getrandom(2) for the state root's own
# identity, which has to differ from the identity of the root it replaced.
rustix = { version = "1.1.5", features = ["fs", "rand"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
herd-runner.workspace = true
herdctl.workspace = true
tempfile.workspace = true
# The killed-hub test runs the real binaries and signals them.
rustix = { version = "1.1.5", features = ["process"] }
