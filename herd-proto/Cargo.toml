[package]
name = "herd-proto"
description = "Herd's wire contract: message types, protocol version, JSON framing"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Log payloads are bytes on the wire, carried as base64 inside the JSON frame
# (D18). data-encoding is already in the tree, under the WebSocket stack.
data-encoding = "2.11.1"
serde.workspace = true
serde_json.workspace = true
# A streamed output file is announced by its sha256 and verified against it
# (D148). The digest is part of the wire contract, so it is computed by one
# function here rather than once in the runner and once in the hub
# (invariant 4).
sha2.workspace = true
