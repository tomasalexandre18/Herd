[package]
name = "herd-runner"
description = "A Herd runner: dials the hub, executes jobs, streams their logs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
herd-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
# A runner's capability declarations come from a JSON file, read strictly so
# that an unknown key — or a key written twice — is refused rather than
# ignored (M5). What it declares is herd-proto's own `Capability`, because the
# protocol is the contract (invariant 4).
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util"] }
# `wss://` on the side that dials. Without a TLS feature here tokio-tungstenite
# compiles no TLS at all and every `wss://` dial fails with "TLS support not
# compiled in", which is what M16's own "done when" and M17's second machine
# need.
#
# **The webpki roots bundled in the binary, not the host's trust store.**
# Cloudflare fronts the hub and terminates TLS there, so the only `wss://`
# dial Herd will ever make is to a publicly trusted certificate: the server's
# own runner and every requester reach the hub on loopback `ws://`, and the
# one client that dials `wss://` is a runner on another machine (M17) going
# through Cloudflare. Against a public certificate the bundled Mozilla root
# set is enough, and it is the same set on every machine — so a runner drops
# onto a host whose trust store we know nothing about and still verifies the
# hub. There is deliberately no "trust this CA" option: with Cloudflare in
# front there is no private CA to trust, and an option nobody needs is surface
# invariant 1 says to refuse.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# Not used by name: it is here to choose rustls' crypto provider, which
# nothing else in the graph chooses. See the workspace manifest.
rustls.workspace = true
# One timestamp, in the notebook of what a job left on this host that this
# runner could not take away (`janitor.rs`, D134). RFC 3339, which is what the
# hub's records and `herdctl`'s output already print — a date a person reads
# beside a path and a figure, and the workspace's own pinned version of the
# crate that already formats it, so there is one spelling of a timestamp in
# the fleet and not two.
time.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The confinement tests need a real hub to dispatch through and a real
# requester to follow a job, and the "binds no listening socket" test needs
# the real runner binary rather than this library in-process.
[dev-dependencies]
herd-hub.workspace = true
herdctl.workspace = true
tempfile.workspace = true
