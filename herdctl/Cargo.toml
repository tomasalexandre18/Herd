[package]
name = "herdctl"
description = "The requester CLI: submit a job, follow its log, exit with its code"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
herd-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite.workspace = true
time.workspace = true

# The exit code is outward-facing, so the test that pins it runs the real
# binary against a real hub and a real runner.
[dev-dependencies]
herd-hub.workspace = true
herd-runner.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "time"] }
