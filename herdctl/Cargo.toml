[package]
name = "herdctl"
description = "The requester CLI: submit a job, follow its log, exit with its code"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
herd-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
# `wss://` on the side that dials, verified against the webpki roots bundled
# in the binary rather than the host's trust store. The reasoning is written
# out once, in `herd-runner/Cargo.toml`; a requester and a runner must make
# the same choice or `wss://` would mean two different things in one fleet.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# Not used by name: it chooses rustls' crypto provider. See the workspace
# manifest.
rustls.workspace = true
time.workspace = true
# The declaration file is deserialized into this crate's own structs, so that
# an unknown key is refused by name (`deny_unknown_fields`) rather than read
# past. The protocol's resolved types are not the file's parser.
serde.workspace = true
# The machine-readable verdict is JSON, and a requester that has to `sed` a
# sentence to learn which machine ran its build is one rewording away from
# reading its fleet wrong (D166).
serde_json.workspace = true
toml.workspace = true

# The exit code is outward-facing, so the test that pins it runs the real
# binary against a real hub and a real runner.
[dev-dependencies]
herd-hub.workspace = true
herd-runner.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "time"] }
